<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BuildYourStudy — Estude o que quiser{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-logo">🚀</span>
        <span class="brand-name">Build<span class="brand-highlight">Your</span>Study</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Catálogo</a>
        <a href="/lixeira" class="nav-link">🗑️ Lixeira</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>🚀 <strong>BuildYourStudy</strong> — Aprenda o que quiser no seu próprio ritmo com lições interativas no navegador.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
