<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BuildYourStudy — Estude o que quiser{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css" />
  <link rel="stylesheet" href="/static/css/broadsheet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="/" style="text-decoration:none;color:inherit"><i class="ph-duotone ph-rocket-launch"></i>Build<span style="color:var(--color-accent-700)">Your</span>Study</a>
    <a href="/">Catálogo</a>
    <a href="/lixeira"><i class="ph-duotone ph-trash"></i> Lixeira</a>
  </nav>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>BuildYourStudy — aprenda o que quiser no seu próprio ritmo, com lições interativas no navegador.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
